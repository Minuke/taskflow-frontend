<div class="confirm-dialog-backdrop">
  <div class="confirm-dialog">
    @if (title()) {
      <h3>{{ title() }}</h3>
    }
    <p>{{ message() }}</p>
    <div class="confirm-dialog-actions">
      <button type="button" (click)="cancelled.emit()">Cancelar</button>
      <button type="button" class="btn-danger" (click)="confirmed.emit()">Confirmar</button>
    </div>
  </div>
</div>
