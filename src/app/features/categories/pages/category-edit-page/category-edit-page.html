@if (category(); as c) {
  <div class="form-panel card">
    <a routerLink="/categories" class="form-panel-back">← Volver a categorías</a>
    <h2>Editar categoría</h2>
    <app-category-form [category]="c" (saved)="onSaved()" (cancelled)="onCancelled()"></app-category-form>
  </div>
} @else {
  <p class="empty-state">Esta categoría no existe o no tienes acceso a ella.</p>
}
