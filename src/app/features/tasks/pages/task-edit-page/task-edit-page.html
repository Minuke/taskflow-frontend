@if (task(); as t) {
  <div class="form-panel card">
    <button type="button" class="form-panel-back" (click)="goBack()">← Volver atrás</button>
    <h2>Editar tarea</h2>
    <app-task-form [task]="t" (saved)="onSaved()" (cancelled)="onCancelled()"></app-task-form>
  </div>
} @else {
  <p class="empty-state">Esta tarea no existe o no tienes acceso a ella.</p>
}
