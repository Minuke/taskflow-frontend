<div class="dashboard-summary">
  <div class="summary-card">
    <span class="summary-value">{{ total() }}</span>
    <span class="summary-label">Total</span>
  </div>
  <div class="summary-card">
    <span class="summary-value">{{ pending() }}</span>
    <span class="summary-label">Pendientes</span>
  </div>
  <div class="summary-card">
    <span class="summary-value">{{ completed() }}</span>
    <span class="summary-label">Completadas</span>
  </div>
  <div class="summary-card">
    <span class="summary-value">{{ dueToday() }}</span>
    <span class="summary-label">Vencen hoy</span>
  </div>
  <div class="summary-card summary-card-warning">
    <span class="summary-value">{{ priorityCount() }}</span>
    <span class="summary-label">Prioritarias</span>
  </div>
</div>
